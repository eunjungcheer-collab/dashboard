<style>
  :root{
    --bg:#EEF3FC;
    --card:#FFFFFF;
    --card-soft:#E8EFFC;
    --rust:#2A52BE;
    --rust-deep:#163B9E;
    --rust-pale:#DCE6FB;
    --plum:#4C4A9E;
    --plum-pale:#E7E5F7;
    --text:#16213A;
    --muted:#5B6B8C;
    --line:#D8E1F5;
    --amber:#8A5A16;
    --amber-bg:#F1E3C9;
    --success:#4C7A5D;
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 3px 14px rgba(20,40,100,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(560px 360px at 90% -8%, rgba(42,82,190,0.10), transparent 65%),
      radial-gradient(480px 360px at 4% 6%, rgba(76,74,158,0.08), transparent 65%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    position:relative;
  }
  .app{position:relative; z-index:1; display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    --paper:#EAF1FF;
    --muted:#93A8D9;
    --line:rgba(244,233,221,0.14);
    width:236px; flex-shrink:0;
    background:linear-gradient(180deg, #16264F, #0E1938);
    padding:30px 0 24px;
    display:flex; flex-direction:column;
  }
  .brand{padding:0 22px 22px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .brand-mark{
    display:inline-flex; align-items:center; gap:8px; color:#7FA8FF;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:11.5px;
    letter-spacing:0.1em;
  }
  .brand-mark svg{flex-shrink:0;}
  .brand h1{
    font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:600;
    margin:12px 0 6px; color:var(--paper); line-height:1.35;
  }
  .brand p{margin:0; font-size:12px; color:var(--muted); line-height:1.6;}

  .nav-label{
    font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.1em;
    color:var(--muted); padding:0 22px; margin:6px 0 10px;
  }
  .tabs{display:flex; flex-direction:column; gap:3px; padding:0 12px;}
  .tab{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px; border-radius:var(--radius-sm); cursor:pointer;
    border:1px solid transparent; background:transparent;
    font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:500;
    color:var(--muted); transition:all .15s ease;
  }
  .tab .dot{width:6px; height:6px; border-radius:50%; background:rgba(244,233,221,0.25); flex-shrink:0; transition:background .15s ease;}
  .tab:hover{color:var(--paper); background:rgba(244,233,221,0.06);}
  .tab.active{
    color:#fff; background:linear-gradient(90deg, rgba(42,82,190,0.55), rgba(42,82,190,0.28));
    border-color:rgba(127,168,255,0.4);
  }
  .tab.active .dot{background:#7FA8FF;}

  /* ---------- Main ---------- */
  main{flex:1; min-width:0; padding:42px 50px 40px; display:flex; flex-direction:column;}
  .content{flex:1;}
  .grade-head{margin-bottom:32px; padding-bottom:18px; border-bottom:1px solid var(--line);}
  .grade-head .eyebrow{
    font-family:'Space Mono', monospace; font-size:11px; color:var(--rust);
    letter-spacing:0.06em; margin-bottom:8px; font-weight:700;
  }
  .grade-head h2{
    font-family:'Space Grotesk', sans-serif; font-size:31px; font-weight:600;
    margin:0; color:var(--text);
  }

  .section{margin-bottom:38px;}
  .section-title{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .section-title h3{
    font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:600; margin:0;
    color:var(--text);
  }
  .section-title .icon{color:var(--rust); flex-shrink:0;}
  .section-title .rule{flex:1; height:1px; background:var(--line);}

  .empty{
    border:1px dashed var(--line); border-radius:var(--radius); padding:22px 20px;
    color:var(--muted); font-size:13px; line-height:1.6; background:var(--card);
  }

  .video-list{display:flex; flex-direction:column; gap:10px;}
  .video-card{
    display:flex; align-items:center; gap:16px;
    background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 18px; text-decoration:none; color:inherit;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .video-card:hover{transform:translateY(-1px); border-color:var(--rust); box-shadow:0 6px 18px rgba(20,40,100,0.12);}
  .video-card .play{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background:var(--rust-pale); color:var(--rust-deep);
    display:flex; align-items:center; justify-content:center;
  }
  .video-card .vtext{flex:1; min-width:0;}
  .video-card .vtitle{font-weight:600; font-size:14.5px; color:var(--text); margin-bottom:3px;}
  .video-card .vurl{font-family:'Space Mono', monospace; font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .video-card .go{color:var(--rust-deep); font-size:12px; font-weight:600; flex-shrink:0;}

  .quiz-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(206px,1fr)); gap:12px;}
  .quiz-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line); border-left:3px solid var(--plum);
    border-radius:var(--radius);
    padding:16px 16px 15px; text-decoration:none; color:inherit;
    box-shadow:var(--shadow);
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .quiz-card:hover{border-left-color:var(--rust); background:var(--card-soft); transform:translateY(-1px);}
  .quiz-unit{
    display:inline-block; font-family:'Space Mono', monospace; font-size:10.5px; font-weight:700;
    color:var(--plum); background:var(--plum-pale);
    padding:2px 8px; border-radius:3px; margin-bottom:10px;
  }
  .quiz-title{font-weight:600; font-size:14.5px; color:var(--text); line-height:1.4;}


  .custom-tag{
    font-family:'Space Mono', monospace; font-size:9px; font-weight:700; color:var(--amber);
    background:var(--amber-bg); border:1px solid rgba(138,90,22,0.25); padding:1px 6px; border-radius:3px;
    margin-left:8px; vertical-align:middle;
  }

  /* bottom admin bar */
  .admin-bar{
    margin-top:36px; padding-top:18px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .admin-bar .note{font-size:11.5px; color:var(--muted);}
  .admin-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); color:var(--muted);
    padding:10px 16px; border-radius:var(--radius-sm); cursor:pointer;
    font-family:'Noto Sans KR',sans-serif; font-size:12.5px; font-weight:600;
    transition:all .15s ease;
  }
  .admin-btn:hover{border-color:var(--rust); color:var(--rust-deep);}

  /* ---------- Overlay / Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,25,55,0.5); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    width:100%; max-width:360px; background:#fff;
    border:1px solid var(--line); border-radius:var(--radius); padding:28px 26px 24px;
    box-shadow:0 30px 70px rgba(15,25,55,0.28);
  }
  .modal h3{font-family:'Space Grotesk',sans-serif; font-size:18px; margin:0 0 6px; color:var(--text);}
  .modal p.sub{font-size:12.5px; color:var(--muted); margin:0 0 20px; line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .field input,.field select{
    width:100%; background:var(--card-soft); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:var(--radius-sm); font-size:13.5px; font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:none; border-color:var(--rust);}
  .modal-actions{display:flex; gap:8px; margin-top:18px;}
  .btn{
    flex:1; padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--line);

    cursor:pointer; font-family:'Noto Sans KR',sans-serif; transition:all .15s ease;
  }
  .btn.primary{background:var(--rust); border-color:var(--rust); color:#fff;}
  .btn.primary:hover{background:var(--rust-deep);}
  .btn:hover{border-color:var(--rust); color:var(--text);}
  .error-msg{color:#B4432B; font-size:12px; margin-top:10px; min-height:14px; font-weight:600;}
  .ok-msg{color:var(--success); font-size:12px; margin-top:10px; min-height:14px; font-weight:600;}

  /* ---------- Admin panel ---------- */
  .admin-overlay{
    position:fixed; inset:0; background:rgba(15,25,55,0.5); backdrop-filter:blur(2px);
    display:none; z-index:60; justify-content:flex-end;
  }

  .admin-panel{
    width:100%; max-width:460px; height:100%; background:#FFFCF8;
    border-left:1px solid var(--line); overflow-y:auto; padding:26px 26px 60px;
  }
  .admin-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .admin-head h3{font-family:'Space Grotesk',sans-serif; font-size:18px; margin:0; color:var(--text);}
  .close-x{background:none; border:none; color:var(--muted); cursor:pointer; font-size:20px; line-height:1; padding:4px;}
  .close-x:hover{color:var(--text);}
  .admin-block{border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; background:var(--card);}
  .admin-block h4{font-family:'Space Grotesk',sans-serif; font-size:13px; margin:0 0 14px; color:var(--rust-deep); letter-spacing:.02em; font-weight:600;}
  .mrow{
    display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px;
  }
  .mrow:last-child{border-bottom:none;}
  .mrow .mr-tag{font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700; color:var(--plum); border:1px solid var(--plum-pale); background:var(--plum-pale); padding:2px 6px; border-radius:3px; flex-shrink:0;}
  .mrow .mr-title{flex:1; min-width:0; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mrow .mr-edit,.mrow .mr-del,.mrow .mr-up,.mrow .mr-down{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px 6px; flex-shrink:0;}
  .mrow .mr-edit:hover{color:var(--rust-deep);}
  .mrow .mr-del:hover{color:#B4432B;}
  .mrow .mr-up:hover,.mrow .mr-down:hover{color:var(--rust-deep);}
  .mrow .mr-up:disabled,.mrow .mr-down:disabled{opacity:0.3; cursor:default;}
  .mrow-edit{padding:10px 0; border-bottom:1px solid var(--line);}
  .mrow-edit .edit-title,.mrow-edit .edit-unit,.mrow-edit .edit-url{
    width:100%; background:var(--card-soft); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:var(--radius-sm); font-size:12.5px; font-family:inherit;
  }
  .edit-actions{display:flex; gap:8px; margin-top:2px;}
  .edit-actions .btn{padding:8px 10px; font-size:12px;}
  .empty-mini{color:var(--muted); font-size:12px; padding:6px 0;}

  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%; padding:18px 0;}
    .tabs{flex-direction:row; overflow-x:auto; padding:0 16px 4px;}
    .tab{white-space:nowrap;}
    main{padding:26px 18px 34px;}
    .grade-head h2{font-size:25px;}
    .admin-panel{max-width:100%;}
    .admin-bar{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>

<script>
// ============================================================
// 백엔드 연결: 구글 시트 + Apps Script 웹 앱 URL을 여기에 붙여넣으세요.
// (배포 방법은 대화창에서 안내한 설정 가이드를 참고하세요)
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzAC_9Fex_a1lYHFHowsoKjkT2OnRHtLUO1mr8Jz9ieJQd_DVwBTxHXy7qSjdUmz2Tp/exec';

const GRADES = ['초6','중1','중2','중3','공통과학','물리학','화학','생명과학','지구과학','구술면접'];

// 백엔드가 아직 연결되지 않았거나 네트워크 오류일 때 보여줄 기본 자료 (읽기 전용)
const SEED_FALLBACK = [
  {id:'b-cho6-q1', grade:'초6', type:'quiz', title:'지구의 운동', unit:'4단원', url:'https://eunjungcheer-collab.github.io/6-4/', order:10},
  {id:'b-jung1-v1', grade:'중1', type:'video', title:'중1 과학 전체 강의', unit:'', url:'https://youtube.com/playlist?list=PLwAliv9fb_U5gpPKSc7s4hugcM4qrhp2s&si=qGxBhfQYCc0kV_eO', order:10},
  {id:'b-jung2-v1', grade:'중2', type:'video', title:'중2 과학 전체 강의', unit:'', url:'https://youtube.com/playlist?list=PLwAliv9fb_U7W4fqFFSfBADt3aMi9ti0-&si=IlQqBiLzH7Y5vnYk', order:10},
  {id:'b-jung2-q1', grade:'중2', type:'quiz', title:'물질의 특성', unit:'1단원', url:'https://eunjungcheer-collab.github.io/2-1', order:10},
  {id:'b-jung2-q2', grade:'중2', type:'quiz', title:'지권의 변화', unit:'2단원', url:'https://eunjungcheer-collab.github.io/2-2', order:20},
  {id:'b-jung2-q4', grade:'중2', type:'quiz', title:'물질의 구성', unit:'4단원', url:'https://eunjungcheer-collab.github.io/2-4', order:30},
  {id:'b-jung2-q5', grade:'중2', type:'quiz', title:'식물의 구성', unit:'5단원', url:'https://eunjungcheer-collab.github.io/2-5', order:40},
  {id:'b-jung2-q6a', grade:'중2', type:'quiz', title:'소화', unit:'6단원', url:'https://eunjungcheer-collab.github.io/2-6-1', order:50},
  {id:'b-jung2-q6b', grade:'중2', type:'quiz', title:'순환', unit:'6단원', url:'https://eunjungcheer-collab.github.io/2-6-2/', order:60},
  {id:'b-jung2-q6c', grade:'중2', type:'quiz', title:'호흡', unit:'6단원', url:'https://eunjungcheer-collab.github.io/2-6-3', order:70},
  {id:'b-jung2-q6d', grade:'중2', type:'quiz', title:'배설', unit:'6단원', url:'https://eunjungcheer-collab.github.io/2-6-4', order:80},
  {id:'b-jung2-q7', grade:'중2', type:'quiz', title:'전기와 자기', unit:'7단원', url:'https://eunjungcheer-collab.github.io/2-7', order:90},
  {id:'b-jung2-q8', grade:'중2', type:'quiz', title:'별과 우주', unit:'8단원', url:'https://eunjungcheer-collab.github.io/2-8', order:100},
  {id:'b-jung3-v1', grade:'중3', type:'video', title:'중3 과학 전체 강의 (2015개정)', unit:'', url:'https://youtube.com/playlist?list=PLwAliv9fb_U4XHvUDsPB8NefoLyFWrDD9&si=5wO92vmbUrLajKT7', order:10},
  {id:'b-common-v1', grade:'공통과학', type:'video', title:'공통과학1 전체 강의', unit:'', url:'https://youtube.com/playlist?list=PLwAliv9fb_U4ofROEkSm_e_VXYC66ZQhk&si=RJFvXA2Nyo3UR1H3', order:10},
  {id:'b-common-v2', grade:'공통과학', type:'video', title:'공통과학2 전체 강의', unit:'', url:'https://youtube.com/playlist?list=PLwAliv9fb_U5_iXfHj1i2h4l84OVFPVqI&si=-b9n4slz8bWC2a6p', order:20},
  {id:'b-interview-q1', grade:'구술면접', type:'quiz', title:'과학교과 구술면접 연습', unit:'면접', url:'https://eunjungcheer-collab.github.io/interviewgms/', order:10}
];

let currentGrade = '초6';
let allLinks = [];        // {id, grade, type, title, unit, url}
let backendReady = false;
let sessionPassword = null;
let editingId = null;
const typeLabel = {video:'동영상', quiz:'퀴즈'};

function isConfigured(){
  return GAS_URL && GAS_URL.indexOf('YOUR_WEB_APP_URL_HERE') === -1;
}

async function fetchAllLinks(){
  if(!isConfigured()) return null;
  try{
    const res = await fetch(GAS_URL + '?action=list');
    const data = await res.json();
    if(data && data.ok) return data.items;
  }catch(e){ console.error(e); }
  return null;
}

async function gasPost(payload){
  if(!isConfigured()) return {ok:false, error:'not-configured'};
  try{
    const res = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(e){
    return {ok:false, error:'network'};
  }
}

// ---------- data helpers ----------
function byOrder(a,b){ return (a.order||0) - (b.order||0); }
function mergedFor(grade){
  const videos = allLinks.filter(l=>l.grade===grade && l.type==='video').sort(byOrder);
  const quizzes = allLinks.filter(l=>l.grade===grade && l.type==='quiz').sort(byOrder);
  return {videos, quizzes};
}
function allItemsForGrade(grade){
  return allLinks.filter(l=>l.grade===grade).sort(byOrder);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortUrl(u){
  try{ const x = new URL(u); return x.hostname + x.pathname.replace(/\/$/,''); }
  catch(e){ return u; }
}

// ---------- render ----------
function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = GRADES.map(g=>{
    return `<div class="tab ${g===currentGrade?'active':''}" data-grade="${g}">
      <span class="dot"></span><span>${g}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ currentGrade = t.dataset.grade; renderAll(); });
  });
}

function renderMain(){
  document.getElementById('gradeEyebrow').textContent = `GRADE / ${currentGrade}`;
  document.getElementById('gradeTitle').textContent = currentGrade + ' 과학';

  const {videos, quizzes} = mergedFor(currentGrade);

  const videoList = document.getElementById('videoList');
  videoList.innerHTML = videos.length ? videos.map(v=>`
    <a class="video-card" href="${escapeHtml(v.url)}" target="_blank" rel="noopener">
      <span class="play">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5Z"/></svg>
      </span>
      <span class="vtext">
        <span class="vtitle">${escapeHtml(v.title)}</span>
        <span class="vurl">${escapeHtml(shortUrl(v.url))}</span>
      </span>
      <span class="go">열기 →</span>
    </a>`).join('') : `<div class="empty">등록된 동영상 강의가 없습니다.</div>`;

  const quizGrid = document.getElementById('quizGrid');
  quizGrid.innerHTML = quizzes.length ? quizzes.map(q=>`
    <a class="quiz-card" href="${escapeHtml(q.url)}" target="_blank" rel="noopener">
      ${q.unit ? `<span class="quiz-unit">${escapeHtml(q.unit)}</span>` : ''}
      <div class="quiz-title">${escapeHtml(q.title)}</div>
    </a>`).join('') : `<div class="empty">등록된 퀴즈가 없습니다.</div>`;

  const noteEl = document.getElementById('adminBarNote');
  if(noteEl){
    noteEl.textContent = backendReady
      ? '© 이은정 과학 연구소'
      : '© 이은정 과학 연구소 · 백엔드 연결 전 (관리자 기능 비활성)';
  }
}

function renderAll(){
  renderTabs();
  renderMain();
}

// ---------- admin: manage list (edit/delete any link) ----------
function renderManageList(){
  const el = document.getElementById('manageList');
  const filterVal = document.getElementById('manageGradeFilter').value;
  const grades = filterVal === 'all' ? GRADES : [filterVal];

  let rows = [];
  grades.forEach(g=>{ allItemsForGrade(g).forEach(item=> rows.push(item)); });

  if(!rows.length){
    el.innerHTML = `<div class="empty-mini">표시할 자료가 없습니다.</div>`;
    return;
  }

  // group-edge info for enabling/disabling up/down buttons
  const groupPos = {};
  rows.forEach(item=>{
    const key = item.grade + '|' + item.type;
    if(!groupPos[key]) groupPos[key] = [];
    groupPos[key].push(item.id);
  });

  el.innerHTML = rows.map(item=>{
    if(item.id === editingId){
      return `
        <div class="mrow mrow-edit" data-id="${item.id}">
          <div class="field" style="margin-bottom:8px;">
            <input type="text" class="edit-title" value="${escapeHtml(item.title)}" placeholder="제목">
          </div>
          <div class="field" style="margin-bottom:8px;">
            <input type="text" class="edit-unit" value="${escapeHtml(item.unit||'')}" placeholder="단원 배지 (선택, 예: 3단원)">
          </div>
          <div class="field" style="margin-bottom:8px;">
            <input type="text" class="edit-url" value="${escapeHtml(item.url)}" placeholder="URL">
          </div>
          <div class="edit-actions">
            <button class="btn" data-action="cancel">취소</button>
            <button class="btn primary" data-action="save" data-id="${item.id}">저장</button>
          </div>
        </div>`;
    }
    const key = item.grade + '|' + item.type;
    const list = groupPos[key] || [];
    const pos = list.indexOf(item.id);
    const isFirst = pos <= 0;
    const isLast = pos === -1 || pos === list.length - 1;
    return `
      <div class="mrow" data-id="${item.id}">
        <span class="mr-tag">${escapeHtml(item.grade)} · ${typeLabel[item.type]||item.type}</span>
        <span class="mr-title">${escapeHtml(item.title)}${item.unit ? ' · ' + escapeHtml(item.unit) : ''}</span>
        <button class="mr-up" data-action="up" data-id="${item.id}" title="위로" ${isFirst?'disabled':''}>▲</button>
        <button class="mr-down" data-action="down" data-id="${item.id}" title="아래로" ${isLast?'disabled':''}>▼</button>
        <button class="mr-edit" data-action="edit" data-id="${item.id}" title="수정">✎</button>
        <button class="mr-del" data-action="del" data-id="${item.id}" title="삭제">✕</button>
      </div>`;
  }).join('');

  el.querySelectorAll('[data-action="edit"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editingId = btn.dataset.id; renderManageList(); });
  });
  el.querySelectorAll('[data-action="cancel"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editingId = null; renderManageList(); });
  });
  el.querySelectorAll('[data-action="del"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      btn.disabled = true;
      const res = await gasPost({action:'delete', password:sessionPassword, id});
      if(res.ok){
        allLinks = allLinks.filter(l=>l.id !== id);
        renderManageList();
        renderAll();
      }else{
        alert('삭제에 실패했습니다: ' + (res.error||''));
        btn.disabled = false;
      }
    });
  });
  el.querySelectorAll('[data-action="save"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const row = btn.closest('.mrow-edit');
      const id = btn.dataset.id;
      const newTitle = row.querySelector('.edit-title').value.trim();
      const newUnit = row.querySelector('.edit-unit').value.trim();
      let newUrl = row.querySelector('.edit-url').value.trim();
      if(!newTitle || !newUrl) return;
      if(!/^https?:\/\//i.test(newUrl)) newUrl = 'https://' + newUrl;
      try{ new URL(newUrl); }catch(e){ return; }

      btn.disabled = true;
      const res = await gasPost({action:'update', password:sessionPassword, id, title:newTitle, unit:newUnit, url:newUrl});
      if(res.ok){
        const item = allLinks.find(l=>l.id===id);
        if(item){ item.title = newTitle; item.unit = newUnit; item.url = newUrl; }
        editingId = null;
        renderManageList();
        renderAll();
      }else{
        alert('수정에 실패했습니다: ' + (res.error||''));
        btn.disabled = false;
      }
    });
  });
  el.querySelectorAll('[data-action="up"],[data-action="down"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const direction = btn.dataset.action === 'up' ? 'up' : 'down';
      btn.disabled = true;
      const res = await gasPost({action:'reorder', password:sessionPassword, id, direction});
      if(res.ok){
        const items = await fetchAllLinks();
        if(items){ allLinks = items; }
        renderManageList();
        renderAll();
      }else{
        btn.disabled = false;
      }
    });
  });
}

function populateManageGradeFilter(){
  const sel = document.getElementById('manageGradeFilter');
  sel.innerHTML = `<option value="all">전체 학년</option>` + GRADES.map(g=>`<option value="${g}">${g}</option>`).join('');
}
function populateAddGradeSelect(){
  const sel = document.getElementById('addGrade');
  sel.innerHTML = GRADES.map(g=>`<option value="${g}">${g}</option>`).join('');
}

// ---------- events: password modal ----------
const pwOverlay = document.getElementById('pwOverlay');
const adminOverlay = document.getElementById('adminOverlay');

document.getElementById('adminOpenBtn').addEventListener('click', ()=>{
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').textContent = '';
  pwOverlay.classList.add('show');
  setTimeout(()=>document.getElementById('pwInput').focus(), 50);
});
document.getElementById('pwCancel').addEventListener('click', ()=> pwOverlay.classList.remove('show'));
pwOverlay.addEventListener('click', (e)=>{ if(e.target===pwOverlay) pwOverlay.classList.remove('show'); });

async function trySubmitPassword(){
  const val = document.getElementById('pwInput').value;
  const submitBtn = document.getElementById('pwSubmit');
  const errEl = document.getElementById('pwError');
  errEl.textContent = '';
  submitBtn.disabled = true;
  const res = await gasPost({action:'checkPassword', password: val});
  submitBtn.disabled = false;

  if(res.error === 'not-configured'){
    errEl.textContent = '백엔드가 아직 연결되지 않았습니다. GAS_URL을 먼저 설정해주세요.';
    return;
  }
  if(res.error === 'network'){
    errEl.textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.';
    return;
  }
  if(res.ok){
    sessionPassword = val;
    pwOverlay.classList.remove('show');
    editingId = null;
    populateAddGradeSelect();
    populateManageGradeFilter();
    renderManageList();
    adminOverlay.classList.add('show');
  }else{
    errEl.textContent = '비밀번호가 올바르지 않습니다.';
  }
}
document.getElementById('pwSubmit').addEventListener('click', trySubmitPassword);
document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') trySubmitPassword(); });

document.getElementById('adminClose').addEventListener('click', ()=> adminOverlay.classList.remove('show'));
adminOverlay.addEventListener('click', (e)=>{ if(e.target===adminOverlay) adminOverlay.classList.remove('show'); });

// ---------- add link ----------
document.getElementById('addBtn').addEventListener('click', async ()=>{
  const grade = document.getElementById('addGrade').value;
  const type = document.getElementById('addType').value;
  const title = document.getElementById('addTitle').value.trim();
  const unit = document.getElementById('addUnit').value.trim();
  const url = document.getElementById('addUrl').value.trim();
  const errEl = document.getElementById('addError');
  const okEl = document.getElementById('addOk');
  errEl.textContent = ''; okEl.textContent = '';

  if(!title || !url){ errEl.textContent = '제목과 URL을 모두 입력해주세요.'; return; }
  let normalizedUrl = url;
  if(!/^https?:\/\//i.test(normalizedUrl)) normalizedUrl = 'https://' + normalizedUrl;
  try{ new URL(normalizedUrl); }catch(e){ errEl.textContent = '올바른 URL 형식이 아닙니다.'; return; }

  const addBtn = document.getElementById('addBtn');
  addBtn.disabled = true;
  const res = await gasPost({action:'add', password:sessionPassword, grade, type, title, url:normalizedUrl, unit});
  addBtn.disabled = false;

  if(!res.ok){
    errEl.textContent = '추가에 실패했습니다: ' + (res.error||'');
    return;
  }

  allLinks.push(res.item);
  document.getElementById('addTitle').value = '';
  document.getElementById('addUnit').value = '';
  document.getElementById('addUrl').value = '';
  okEl.textContent = '추가되었습니다.';
  renderManageList();
  renderAll();
  setTimeout(()=>{ okEl.textContent=''; }, 2000);
});

// ---------- change password ----------
document.getElementById('changePwBtn').addEventListener('click', async ()=>{
  const p1 = document.getElementById('newPw').value;
  const p2 = document.getElementById('newPw2').value;
  const errEl = document.getElementById('pwChangeError');
  const okEl = document.getElementById('pwChangeOk');
  errEl.textContent=''; okEl.textContent='';

  if(!p1 || p1.length < 2){ errEl.textContent = '비밀번호를 2자 이상 입력해주세요.'; return; }
  if(p1 !== p2){ errEl.textContent = '비밀번호가 서로 일치하지 않습니다.'; return; }

  const res = await gasPost({action:'setPassword', oldPassword:sessionPassword, newPassword:p1});
  if(!res.ok){
    errEl.textContent = '변경에 실패했습니다: ' + (res.error||'');
    return;
  }
  sessionPassword = p1;
  document.getElementById('newPw').value = '';
  document.getElementById('newPw2').value = '';
  okEl.textContent = '비밀번호가 변경되었습니다.';
  setTimeout(()=>{ okEl.textContent=''; }, 2500);
});

// ---------- init ----------
(async function init(){
  const items = await fetchAllLinks();
  if(items){
    allLinks = items;
    backendReady = true;
  }else{
    allLinks = SEED_FALLBACK.slice();
    backendReady = false;
  }
  renderAll();
})();
</script>
